name: Update Repo List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'imSandeep-dev',
              sort: 'updated',
              per_page: 100
            });

            const filtered = repos.filter(r => !r.fork);

            let table = '| Repository | Description | Language | Stars |\n';
            table += '|---|---|---|---|\n';
            for (const r of filtered) {
              const desc = (r.description || '-').replace(/\|/g, '-');
              table += `| [${r.name}](${r.html_url}) | ${desc} | ${r.language || '-'} | ${r.stargazers_count} |\n`;
            }

            let readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!--START_SECTION:repos-->';
            const end = '<!--END_SECTION:repos-->';
            const startIdx = readme.indexOf(start) + start.length;
            const endIdx = readme.indexOf(end);

            if (startIdx === -1 || endIdx === -1) {
              core.setFailed('Could not find START_SECTION:repos / END_SECTION:repos markers in README.md');
              return;
            }

            readme = readme.slice(0, startIdx) + '\n\n' + table + '\n' + readme.slice(endIdx);
            fs.writeFileSync('README.md', readme);

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update repo list"
          file_pattern: README.md